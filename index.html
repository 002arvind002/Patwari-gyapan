<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>पटवारी ज्ञापन प्रबंधन</title>
<style>
:root{--primary:#175c50;--accent:#e2a84b;--bg:#f4f7f6;--text:#18332f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}header{background:linear-gradient(135deg,#12483f,#21816d);color:#fff;padding:28px 18px;box-shadow:0 3px 12px #1232}header h1{max-width:1100px;margin:0 auto 5px;font-size:clamp(24px,4vw,38px)}header p{max-width:1100px;margin:auto;opacity:.9}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px #16352b12}.stat b{display:block;font-size:30px;color:var(--primary)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:200px}.btn{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700;background:var(--primary);color:#fff}.btn.secondary{background:#e7eeec;color:var(--primary)}.btn.danger{background:#b53b3b}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700}input,textarea,select{font:inherit;border:1px solid #cad8d4;border-radius:8px;padding:11px;background:#fff}textarea{min-height:82px;resize:vertical}.actions{display:flex;gap:8px;align-items:end}.empty{text-align:center;color:#668078;padding:35px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #e5ece9;vertical-align:top}.table th{background:#edf4f1;color:var(--primary)}.small{font-size:12px;color:#63756f}.hidden{display:none}@media(max-width:650px){.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body>
<header><h1>पटवारी ज्ञापन प्रबंधन</h1><p>ज्ञापन के सभी कार्यों और रिकॉर्ड को व्यवस्थित रूप से संभालें</p></header>
<main class="wrap">
<section class="stats"><div class="card stat"><span>कुल ज्ञापन</span><b id="total">0</b></div><div class="card stat"><span>आज जोड़े गए</span><b id="today">0</b></div><div class="card stat"><span>लंबित कार्य</span><b id="pending">0</b></div></section>
<section class="card"><h2 id="formTitle">नया ज्ञापन जोड़ें</h2><form id="form" class="form"><input type="hidden" id="editId"><div class="field"><label for="number">ज्ञापन क्रमांक *</label><input id="number" required placeholder="जैसे: 01/2026"></div><div class="field"><label for="date">दिनांक *</label><input id="date" type="date" required></div><div class="field"><label for="subject">विषय *</label><input id="subject" required placeholder="ज्ञापन का विषय"></div><div class="field"><label for="status">स्थिति</label><select id="status"><option>लंबित</option><option>पूर्ण</option><option>प्रगति में</option></select></div><div class="field full"><label for="details">विवरण</label><textarea id="details" placeholder="अतिरिक्त विवरण लिखें"></textarea></div><div class="actions full"><button class="btn" type="submit">सहेजें</button><button class="btn secondary hidden" type="button" id="cancel">रद्द करें</button></div></form></section>
<section class="card"><div class="toolbar"><input id="search" placeholder="क्रमांक या विषय से खोजें..."><button class="btn secondary" id="export">डेटा डाउनलोड करें</button><button class="btn danger" id="clear">सभी हटाएँ</button></div><div class="table-wrap"><table class="table"><thead><tr><th>क्रमांक</th><th>दिनांक</th><th>विषय</th><th>स्थिति</th><th>विवरण</th><th>कार्य</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">अभी कोई ज्ञापन दर्ज नहीं है।</div></div></section>
</main>
<script>
const key='patwari-gyapan-records';let records=JSON.parse(localStorage.getItem(key)||'[]');
const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);$('date').value=today;
function save(){localStorage.setItem(key,JSON.stringify(records));render()}
function render(){const q=$('search').value.toLowerCase();const list=records.filter(x=>(x.number+' '+x.subject+' '+x.details).toLowerCase().includes(q));$('total').textContent=records.length;$('today').textContent=records.filter(x=>x.created===today).length;$('pending').textContent=records.filter(x=>x.status!=='पूर्ण').length;$('rows').innerHTML=list.map(x=>`<tr><td><b>${esc(x.number)}</b></td><td>${esc(x.date)}</td><td>${esc(x.subject)}</td><td>${esc(x.status)}</td><td>${esc(x.details||'-')}</td><td><button class="btn secondary" onclick="edit('${x.id}')">संपादित</button> <button class="btn danger" onclick="removeItem('${x.id}')">हटाएँ</button></td></tr>`).join('');$('empty').style.display=list.length?'none':'block'}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('form').onsubmit=e=>{e.preventDefault();const id=$('editId').value;const item={id:id||Date.now().toString(),number:$('number').value.trim(),date:$('date').value,subject:$('subject').value.trim(),status:$('status').value,details:$('details').value.trim(),created:id?(records.find(x=>x.id===id)||{}).created:today};if(id)records=records.map(x=>x.id===id?item:x);else records.unshift(item);save();reset()};
function edit(id){const x=records.find(x=>x.id===id);$('editId').value=x.id;$('number').value=x.number;$('date').value=x.date;$('subject').value=x.subject;$('status').value=x.status;$('details').value=x.details;$('formTitle').textContent='ज्ञापन संपादित करें';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}
function removeItem(id){if(confirm('क्या यह ज्ञापन हटाना चाहते हैं?')){records=records.filter(x=>x.id!==id);save()}}
function reset(){$('form').reset();$('date').value=today;$('editId').value='';$('formTitle').textContent='नया ज्ञापन जोड़ें';$('cancel').classList.add('hidden')}
$('cancel').onclick=reset;$('search').oninput=render;$('clear').onclick=()=>{if(records.length&&confirm('सभी रिकॉर्ड हटाएँ?')){records=[];save()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='patwari-gyapan-data.json';a.click()};render();
</script></body></html>
